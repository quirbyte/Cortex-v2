name: Cortex CI Pipeline

on: 
    push: 
        branches: [main,master]
    pull_request: 
        branches: [main,master]

jobs:
    validate-and-build:
        runs-on: ubuntu-latest
        
        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_PASSWORD : mysecretpassword
                    POSTGRES_DB : test_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
        
            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            
            - name: Install dependencies
              run: npm ci

            - name: Run Linter
              run: npm run lint
              continue-on-error: false
            
            - name: Validate Prisma Schema
              run: npx prisma validate
            
            - name: Generate prisma client and run Dummy migration
              run: |
               npx prisma generate
               npx prisma db push
              env:
                DATABASE_URL : postgresql://postgres:mysecretpassword@localhost:5432/test_db
            
            - name: Run Production Build
              run: npm run build
              env: 
                DATABASE_URL : postgresql://postgres:mysecretpassword@localhost:5432/test_db
                NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'fallback-secret-for-ci-build' }}